# Memanggil /api/remind setiap jam agar pengingat "waktunya mengisi rencana"
# terkirim ke HP/laptop walau aplikasi tertutup.
#
# Langsung jalan untuk https://plan-djtzy.vercel.app. Situs lain: GitHub → Settings →
# Secrets and variables → Actions → Variables → APP_URL = https://alamat-situsmu.vercel.app
# (opsional) Secrets → CRON_SECRET, sama dengan variabel CRON_SECRET di Vercel.
# Catatan: jadwal GitHub bisa terlambat beberapa menit dan berhenti otomatis bila
# repositori tidak ada aktivitas 60 hari. Alternatif yang lebih tepat waktu: cron-job.org.
name: Pengingat per jam

on:
  schedule:
    # Menit ke-3, bukan :00 (jam tepat paling padat di GitHub dan sering terlambat).
    - cron: '3 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Panggil /api/remind
        env:
          APP_URL: ${{ vars.APP_URL }}
          KEY: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${APP_URL:-https://plan-djtzy.vercel.app}"
          code=$(curl -sS -o body.txt -w '%{http_code}' --retry 3 --max-time 30 \
            -H "Authorization: Bearer ${KEY}" "${URL%/}/api/remind") || code=000
          cat body.txt 2>/dev/null; echo
          echo "HTTP ${code}"
          # Jangan gagalkan job (supaya tidak ada email gagal tiap jam); cukup beri peringatan.
          case "$code" in
            2*) ;;
            401) echo "::warning::Kunci ditolak: samakan secret CRON_SECRET di GitHub dengan CRON_SECRET di Vercel." ;;
            *) echo "::warning::/api/remind membalas HTTP ${code}." ;;
          esac
