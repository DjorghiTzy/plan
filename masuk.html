<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Masuk · Rencana Harian</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F3F6F2">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="gate-body">
  <main class="gate">
    <section class="gate-card" aria-labelledby="gate-title">
      <div class="gate-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="24" rx="5"/><path d="M3 12h26"/><path d="M10 3v5M22 3v5"/><path d="m10.5 20 3.5 3.5 7.5-7.5"/></svg>
        </span>
        <div>
          <h1 id="gate-title">Rencana Harian</h1>
          <p class="gate-lock"><svg class="icon inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Aplikasi pribadi. Masuk untuk melanjutkan.</p>
        </div>
      </div>

      <div class="segmented auth-tabs" role="tablist" aria-label="Cara masuk">
        <button type="button" role="tab" data-tab="masuk" aria-selected="true" aria-pressed="true">Masuk</button>
        <button type="button" role="tab" data-tab="kode" aria-selected="false" aria-pressed="false">Pakai kode</button>
        <button type="button" role="tab" data-tab="daftar" aria-selected="false" aria-pressed="false">Buat akun</button>
      </div>

      <form class="form" id="gate-form" novalidate hidden>
        <div class="field" data-for="daftar" hidden>
          <label for="gate-name">Nama panggilan <span class="muted">(opsional)</span></label>
          <input id="gate-name" name="name" type="text" maxlength="40" autocomplete="nickname">
        </div>
        <div class="field" data-for="masuk daftar" data-mode="email">
          <label for="gate-email">Email</label>
          <input id="gate-email" name="email" type="email" maxlength="254" autocomplete="username" required>
        </div>
        <div class="field" data-for="masuk" data-mode="username" hidden>
          <label for="gate-username">Nama pengguna</label>
          <input id="gate-username" name="username" type="text" maxlength="32" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div class="field" data-for="masuk daftar">
          <label for="gate-password">Kata sandi</label>
          <input id="gate-password" name="password" type="password" minlength="8" maxlength="200" autocomplete="current-password" required>
        </div>
        <div class="field" data-for="kode" hidden>
          <label for="gate-code">Kode dari perangkat yang sudah masuk</label>
          <input id="gate-code" name="code" type="text" maxlength="9" placeholder="ABCD-EFGH" autocomplete="one-time-code" class="code-input">
          <p class="hint">Di perangkat lain buka <strong>Pengaturan → Hubungkan perangkat lain</strong>, lalu ketik kodenya atau pindai QR-nya.</p>
        </div>
        <p class="hint" data-for="daftar" hidden>Pendaftaran hanya untuk email yang diizinkan pemilik aplikasi.</p>
        <p class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn primary gate-submit" id="gate-submit">Masuk</button>
      </form>

      <div class="gate-loading" id="gate-loading" aria-live="polite"><span class="spinner" aria-hidden="true"></span> Menyiapkan…</div>
      <p class="gate-note" id="gate-note" hidden></p>
      <a class="link-btn gate-back" href="./" id="gate-back" hidden>Kembali ke aplikasi</a>
    </section>
  </main>
  <script src="js/gate.js"></script>
</body>
</html>
