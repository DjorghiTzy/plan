<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rencana Harian</title>
  <meta name="description" content="Perencana harian berbahasa Indonesia: tugas, linimasa, kebiasaan, Pomodoro, jurnal, dan statistik. Berjalan di browser tanpa akun.">
  <meta name="theme-color" content="#F3F6F2">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=9">
</head>
<body>
  <a class="skip-link" href="#view">Lompat ke konten</a>

  <div class="shell">
    <aside class="sidebar" aria-label="Navigasi utama">
      <a class="brand" href="#beranda" data-go="beranda">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="24" rx="5"/><path d="M3 12h26"/><path d="M10 3v5M22 3v5"/><path d="m10.5 20 3.5 3.5 7.5-7.5"/></svg>
        </span>
        <span class="brand-name">Rencana<br>Harian</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="mini-cal" id="mini-cal"></div>
      <p class="sidebar-foot">Tekan <kbd>?</kbd> untuk pintasan keyboard</p>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="brand compact" href="#beranda" data-go="beranda" aria-label="Rencana Harian, ke Beranda">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="24" rx="5"/><path d="M3 12h26"/><path d="M10 3v5M22 3v5"/><path d="m10.5 20 3.5 3.5 7.5-7.5"/></svg>
          </span>
        </a>
        <div class="datenav">
          <button type="button" class="icon-btn" data-shift="-1" aria-label="Hari sebelumnya" title="Hari sebelumnya (←)"></button>
          <button type="button" class="date-btn" data-open-cal aria-haspopup="dialog">
            <span class="date-main" id="date-main"></span>
            <span class="date-rel" id="date-rel"></span>
          </button>
          <button type="button" class="icon-btn" data-shift="1" aria-label="Hari berikutnya" title="Hari berikutnya (→)"></button>
          <button type="button" class="btn small ghost" data-today hidden>Hari ini</button>
        </div>
        <div class="top-actions">
          <button type="button" class="timer-pill" data-timer-pill data-go="fokus" hidden aria-label="Buka timer fokus">
            <span class="pulse" aria-hidden="true"></span><span data-timer-text></span>
          </button>
          <button type="button" class="sync-pill" data-sync-pill hidden></button>
          <button type="button" class="icon-btn" data-search aria-label="Cari tugas" title="Cari tugas (Ctrl+K)"></button>
          <button type="button" class="icon-btn" data-theme-toggle aria-label="Ganti tema terang/gelap" title="Ganti tema"></button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1">
        <div class="boot" role="status"><span class="spinner" aria-hidden="true"></span><span>Menyiapkan rencanamu…</span></div>
      </main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navigasi utama"></nav>

  <noscript><p class="noscript">Aplikasi ini membutuhkan JavaScript.</p></noscript>

  <script src="js/core/date.js?v=9"></script>
  <script src="js/core/logic.js?v=9"></script>
  <script src="js/core/prayer.js?v=9"></script>
  <script src="js/data/proverbs.js?v=9"></script>
  <script src="js/data/templates.js?v=9"></script>
  <script src="js/data/sample.js?v=9"></script>
  <script src="js/core/syncmap.js?v=9"></script>
  <script src="js/store.js?v=9"></script>
  <script src="js/ui.js?v=9"></script>
  <script src="js/morph.js?v=9"></script>
  <script src="js/sync.js?v=9"></script>
  <script src="js/account.js?v=9"></script>
  <script src="js/components.js?v=9"></script>
  <script src="js/templates-ui.js?v=9"></script>
  <script src="js/work.js?v=9"></script>
  <script src="js/timer.js?v=9"></script>
  <script src="js/reminder.js?v=9"></script>
  <script src="js/ambient.js?v=9"></script>
  <script src="js/ritual.js?v=9"></script>
  <script src="js/views/beranda.js?v=9"></script>
  <script src="js/views/rencana.js?v=9"></script>
  <script src="js/views/pekan.js?v=9"></script>
  <script src="js/views/kebiasaan.js?v=9"></script>
  <script src="js/views/fokus.js?v=9"></script>
  <script src="js/views/jurnal.js?v=9"></script>
  <script src="js/views/statistik.js?v=9"></script>
  <script src="js/views/pengaturan.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
